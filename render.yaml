services:
  - type: web
    name: risktrace-engine
    runtime: python
    plan: free
    branch: graph-visualization
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USE_NEO4J
        value: false
      - key: MONITOR_INTERVAL
        value: 120
      - key: RISKTRACE_ALLOW_MODEL_DOWNLOAD
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
